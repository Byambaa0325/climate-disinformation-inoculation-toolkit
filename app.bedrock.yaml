# Cloud Run configuration — AWS Bedrock backend
# Deploy: gcloud run deploy climate-disinfo --region us-central1 --source .

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: climate-disinformation
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/climate-disinformation
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
          env:
            - name: BEDROCK_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: bedrock-credentials
                  key: team-id
            - name: BEDROCK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bedrock-credentials
                  key: api-token
